name: allnote

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-AllNote}
      # Leave empty to derive the URL from the incoming request (works behind the tunnel).
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - allnote-data:/data
    networks:
      - tunnel_net

networks:
  tunnel_net:
    external: true

volumes:
  allnote-data: