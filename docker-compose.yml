name: allnote

services:
  app:
    build: .
    restart: unless-stopped
    # No published ports: the tunnel reaches it on tunnel_net at http://allnote:80
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    environment:
      APP_NAME: ${APP_NAME:-AllNote}
      PORT: ${PORT:-80}
      # Leave empty to derive the URL from the incoming request (works behind the tunnel).
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - allnote-data:/data
    networks:
      tunnel_net:
        aliases:
          - allnote

networks:
  tunnel_net:
    name: tunnel_net
    external: true

volumes:
  allnote-data: