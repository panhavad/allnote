      <path d="M27.5 14h5v26h-5z"/>
      <path d="M17.6 30h9.9v4.4h-9.9z"/>
      <path d="M27.5 14h5.9L48 40h-5.9z"/>
      <path d="M43 14h5v26h-5z"/>
    </g>
    <!-- open book -->
    <path d="M10 43.2c7.4-2.4 15.8-2.2 21 1.4v8.6c-5.2-3.2-13.6-3.4-21-1.2zM54 43.2c-7.4-2.4-15.8-2.2-21 1.4v8.6c5.2-3.2 13.6-3.4 21-1.2z"/>
